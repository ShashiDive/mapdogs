<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mapdogs: Pune's street dogs</title>
  <meta name="description" content="Photograph a street dog in Pune and help volunteers track which dogs are sterilised, vaccinated or need help.">
  <meta name="theme-color" content="#0F6B5C">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='14' width='52' height='36' rx='18' fill='%23F2B705'/%3E%3Ccircle cx='20' cy='32' r='5' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>

  <!-- Hidden photo pickers: camera (FR-05) and gallery (FR-06) -->
  <input id="cam-input" type="file" accept="image/*" capture="environment" hidden>
  <input id="gal-input" type="file" accept="image/*" hidden>

  <noscript><p class="noscript">Mapdogs needs JavaScript turned on in your browser.</p></noscript>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
